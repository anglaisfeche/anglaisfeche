<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mots de liaison</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .connector-badge {
    display: inline-block; font-family: 'Cinzel', serif; font-weight: 600;
    font-size: 1.3rem; color: var(--emerald); border-bottom: 2px solid var(--gold);
    padding-bottom: 0.15rem; margin-bottom: 0.2rem;
  }
  .meta-line { font-size: 0.85rem; color: var(--text-muted); margin: 0.2rem 0 1.1rem; }
  .base-sentences { list-style: none; margin: 0 0 1.2rem; padding: 0; }
  .base-sentences li {
    background: var(--paper); border-left: 3px solid var(--gold);
    padding: 0.55rem 0.8rem; margin-bottom: 0.5rem; font-size: 0.95rem;
  }
  .zone-label { display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:0.4rem; }
  .build-zone {
    min-height: 64px; background: var(--paper); border: 1px dashed var(--border);
    padding: 0.7rem 0.8rem; margin-bottom: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: flex-start;
  }
  .word-bank {
    min-height: 54px; padding: 0.5rem 0; margin-bottom: 1rem;
    display: flex; flex-wrap: wrap; gap: 0.4rem;
  }
  .word-tile {
    all: unset; cursor: pointer; background: var(--paper-alt); border: 1px solid var(--gold);
    padding: 0.4rem 0.75rem; font-size: 0.92rem; color: var(--ink);
  }
  .word-tile:hover { border-color: var(--emerald); }
  .build-zone .word-tile { border-color: var(--border); background: #fff; }
  .build-zone .word-tile.pos-ok { border-color: var(--emerald); background: var(--emerald-bg); }
  .build-zone .word-tile.pos-bad { border-color: var(--burgundy); background: var(--burgundy-bg); }
  .model-box {
    display: none; background: var(--emerald-bg); border: 1px solid var(--emerald);
    padding: 0.9rem 1rem; margin-top: 1rem; font-size: 0.95rem;
  }
  .model-box.show { display: block; }
  .result-line { font-size: 0.9rem; font-weight: 600; margin: 0.9rem 0 0; }
  .result-line.ok { color: var(--emerald); }
  .result-line.ko { color: var(--burgundy); }
  .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .filter-row { margin-bottom: 1.2rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .filter-row button { font-size: 0.72rem; padding: 0.45rem 0.8rem; }
  .filter-row button.active { background: var(--emerald); border-color: var(--emerald); color: #fff; }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="brand">✦ Outils pédagogiques</a>
</header>

<main>
  <a class="back-link" href="../index.html">&larr; Retour à l'accueil</a>
  <h1 class="page-title">Mots de liaison</h1>
  <p class="page-subtitle">Reconstituez la phrase dans le bon ordre en utilisant le connecteur donné, pour vous entraîner à complexifier votre expression.</p>

  <div class="tool-shell">
    <div class="filter-row" id="filter-row"></div>
    <div id="exercise-area"></div>
    <div class="btn-row" style="margin-top:1rem;">
      <button id="check-btn">Vérifier ma réponse</button>
      <button id="reset-btn" class="secondary">Recommencer</button>
      <button id="reveal-btn" class="secondary">Voir la phrase</button>
      <button id="next-btn" class="secondary">Phrase suivante</button>
    </div>
    <p class="result-line" id="result-line"></p>
  </div>
</main>

<footer class="site-footer">Outil pédagogique — Mots de liaison</footer>

<script src="connecteurs-data.js"></script>
<script>
let currentCategory = 'all';
let pool = [];
let current = null;
let tokens = [];      // mots de la phrase modèle, dans l'ordre original
let bankOrder = [];   // indices mélangés, ordre d'affichage dans la banque de mots
let built = [];       // indices dans l'ordre où l'élève les a cliqués
let checked = false;

function categories() {
  return ['all', ...new Set(CONNECTORS.map(c => c.category))];
}

function renderFilters() {
  const row = document.getElementById('filter-row');
  row.innerHTML = '';
  categories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'secondary' + (cat === currentCategory ? ' active' : '');
    btn.textContent = cat === 'all' ? 'Toutes les catégories' : cat;
    btn.addEventListener('click', () => { currentCategory = cat; renderFilters(); buildPool(); pickNext(); });
    row.appendChild(btn);
  });
}

function buildPool() {
  pool = CONNECTORS.filter(c => currentCategory === 'all' || c.category === currentCategory);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickNext() {
  if (pool.length === 0) return;
  current = pool[Math.floor(Math.random() * pool.length)];
  tokens = current.model.split(/\s+/);
  let order;
  do { order = shuffle(tokens.map((_, i) => i)); } while (tokens.length > 2 && order.every((v, i) => v === i));
  bankOrder = order;
  built = [];
  checked = false;
  renderExercise();
}

function renderExercise() {
  const area = document.getElementById('exercise-area');
  area.innerHTML = `
    <span class="connector-badge">${current.connector}</span>
    <p class="meta-line">${current.translation} — ${current.usage}</p>
    <ul class="base-sentences">${current.base.map(s => `<li>${s}</li>`).join('')}</ul>
    <label class="zone-label">Votre phrase (cliquez un mot ci-dessous pour le retirer)</label>
    <div class="build-zone" id="build-zone"></div>
    <label class="zone-label">Banque de mots (cliquez un mot pour l'ajouter à votre phrase)</label>
    <div class="word-bank" id="word-bank"></div>
    <div class="model-box" id="model-box"><strong>Phrase correcte :</strong><br>${current.model}</div>
  `;
  document.getElementById('result-line').textContent = '';
  document.getElementById('result-line').className = 'result-line';
  renderZones();
}

function renderZones() {
  const bank = document.getElementById('word-bank');
  const zone = document.getElementById('build-zone');
  bank.innerHTML = '';
  zone.innerHTML = '';

  bankOrder.filter(i => !built.includes(i)).forEach(i => {
    const btn = document.createElement('button');
    btn.className = 'word-tile';
    btn.textContent = tokens[i];
    btn.addEventListener('click', () => {
      if (checked) return;
      built.push(i);
      renderZones();
    });
    bank.appendChild(btn);
  });

  built.forEach((i, pos) => {
    const btn = document.createElement('button');
    btn.className = 'word-tile';
    if (checked) btn.classList.add(pos === i ? 'pos-ok' : 'pos-bad');
    btn.textContent = tokens[i];
    btn.addEventListener('click', () => {
      if (checked) return;
      built.splice(pos, 1);
      renderZones();
    });
    zone.appendChild(btn);
  });
}

function runCheck() {
  checked = true;
  const line = document.getElementById('result-line');
  const complete = built.length === tokens.length;
  const correct = complete && built.every((i, pos) => i === pos);
  if (correct) {
    line.textContent = 'Correct ! La phrase est bien formée.';
    line.classList.add('ok');
  } else if (!complete) {
    line.textContent = `Pas encore terminé — il reste ${tokens.length - built.length} mot(s) dans la banque.`;
    line.classList.add('ko');
  } else {
    const wrong = built.filter((i, pos) => i !== pos).length;
    line.textContent = `Pas tout à fait — ${wrong} mot(s) mal placé(s).`;
    line.classList.add('ko');
  }
  renderZones();
}

document.getElementById('check-btn').addEventListener('click', runCheck);
document.getElementById('reset-btn').addEventListener('click', () => {
  built = [];
  checked = false;
  renderZones();
  document.getElementById('result-line').textContent = '';
  document.getElementById('result-line').className = 'result-line';
});
document.getElementById('reveal-btn').addEventListener('click', () => {
  document.getElementById('model-box').classList.add('show');
});
document.getElementById('next-btn').addEventListener('click', () => {
  pickNext();
});

renderFilters();
buildPool();
pickNext();
</script>

</body>
</html>
