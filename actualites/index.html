<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fil d'actualité</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .news-card {
    background: var(--paper-alt); border: 1px solid var(--gold);
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--border);
    margin: 4px 4px 1.3rem; padding: 1.3rem 1.4rem;
  }
  .news-card .source {
    display: inline-block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--gold); font-weight: 600; margin-bottom: 0.4rem;
  }
  .news-card h3 { margin: 0 0 0.5rem; font-size: 1.1rem; }
  .news-card h3 a { color: var(--ink); text-decoration: none; }
  .news-card h3 a:hover { color: var(--emerald); }
  .news-card p { margin: 0 0 0.6rem; font-size: 0.92rem; color: var(--ink-soft); }
  .news-card .date { font-size: 0.75rem; color: var(--text-muted); }
  .stale-notice, .empty-notice {
    border: 1px dashed var(--border); background: var(--paper-alt);
    padding: 1rem 1.1rem; font-size: 0.9rem; font-style: italic; color: var(--ink-soft); margin-bottom: 1.5rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="brand">✦ Outils pédagogiques</a>
</header>

<main>
  <a class="back-link" href="../index.html">&larr; Retour à l'accueil</a>
  <h1 class="page-title">Fil d'actualité</h1>
  <p class="page-subtitle">Grands titres récents de la presse anglophone (The Guardian, BBC News, The New York Times), mis à jour chaque jour automatiquement.</p>

  <div id="notice"></div>
  <div id="news-list"></div>
</main>

<footer class="site-footer">Outil pédagogique — Fil d'actualité (mis à jour automatiquement via GitHub Actions)</footer>

<script>
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

fetch('news.json')
  .then(r => r.json())
  .then(data => {
    const notice = document.getElementById('notice');
    const list = document.getElementById('news-list');

    if (!data.items || data.items.length === 0) {
      notice.innerHTML = `<div class="empty-notice">Le fil d'actualité n'a pas encore été généré. Une fois ce site publié sur GitHub Pages, l'action automatique (voir .github/workflows/update-news.yml) le remplira chaque jour. Vous pouvez aussi la lancer manuellement depuis l'onglet « Actions » du dépôt GitHub (bouton « Run workflow »).</div>`;
      return;
    }

    const generated = new Date(data.generatedAt);
    const ageDays = (Date.now() - generated.getTime()) / (1000 * 60 * 60 * 24);
    if (ageDays > 2) {
      notice.innerHTML = `<div class="stale-notice">Dernière mise à jour : ${formatDate(data.generatedAt)}. Si cela fait plus de 2 jours, vérifiez que l'action GitHub « Mettre à jour le fil d'actualité » s'exécute bien.</div>`;
    }

    list.innerHTML = data.items.map(item => `
      <article class="news-card">
        <span class="source">${item.source}</span>
        <h3><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></h3>
        <p>${item.summary}</p>
        <span class="date">${formatDate(item.date)}</span>
      </article>
    `).join('');
  })
  .catch(() => {
    document.getElementById('notice').innerHTML = `<div class="empty-notice">Impossible de charger le fil d'actualité pour le moment.</div>`;
  });
</script>

</body>
</html>
